[project]
name = 'datavac-backend'
version = '0.1.0'
description = 'API for web site'
readme = 'README.md'
requires-python = '>=3.12'
dependencies = [
    'asgiref==3.11.1',
    'attrs==26.1.0',
    'click==8.3.2',
    'click-default-group==1.2.4',
    'django==6.0.4',
    'django-cors-headers==4.9.0',
    'djangorestframework==3.17.1',
    'dotenv-linter==0.7.0',
    'gunicorn==25.3.0',
    'iniconfig==2.3.0',
    'lark==1.3.1',
    'packaging==26.1',
    'pluggy==1.6.0',
    'psycopg2==2.9.12',
    'pygments==2.20.0',
    'pytest==9.0.3',
    'python-decouple==3.8',
    'ruff==0.15.11',
    'sqlparse==0.5.5',
    'typing-extensions==4.15.0',
    'pytest-django>=4.11.1',
    'django-filter>=25.2',
    'drf-extra-fields>=3.7.0',
    'pillow>=12.2.0',
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
DJANGO_SETTINGS_MODULE = "datavac.settings"
pythonpath = ["backend"]
testpaths = ["backend/contraindications/tests", "backend/instructions/tests", "backend/search/tests"]

[tool.ruff]
line-length = 120
target-version = 'py310'
exclude = [
    'backend/tests/',
]

[tool.ruff.lint]
select = ['E', 'F', 'I', 'Q', 'D']
ignore = [
    'A005',   # allow to shadow stdlib and builtin module names
    'COM812', # trailing comma, conflicts with `ruff format`
    # Different doc rules that we don't really care about:
    'D100',
    'D101',
    'D102',
    'D104',
    'D106',
    'D203',
    'D212',
    'D401',
    'D404',
    'D405',
    'ISC001',  # implicit string concat conflicts with `ruff format`
    'ISC003',  # prefer explicit string concat over implicit concat
    'PLR09',   # we have our own complexity rules
    'PLR2004', # do not report magic numbers
    'PLR6301', # do not require classmethod / staticmethod when self not used
    'TRY003',  # long exception messages from `tryceratops`
]

# Plugin configs:
flake8-quotes.inline-quotes = 'single'

[tool.ruff.lint.per-file-ignores]
'*/migrations/*.py' = ['D101', 'E501', 'RUF012', 'Q000']
'tests/*.py' = ['S101']
'*/models.py' = ['D105']

[tool.ruff.format]
quote-style = 'single'
docstring-code-format = true
skip-magic-trailing-comma = false
exclude = []


[tool.ruff.lint.pydocstyle]
convention = 'google'

# Coverage
[tool.coverage.run]
source = ['src']
omit = [
    '*/migrations/*',
    '*/tests/*',
    '*/__pycache__/*',
    '*/settings/*',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'class .*\bProtocol\\):',
    '@(abc\\.)?abstractmethod',
]
[tool.ruff.lint.isort]
known-first-party = ["api", "reference_books", "contraindications", "vaccines",]