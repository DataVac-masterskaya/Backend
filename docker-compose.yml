---

# Default compose file for development and production.
# Should be used directly in development.
# Automatically loads `docker-compose.override.yml` if it exists.
# No extra steps required.
# Should be used together with `docker/docker-compose.server.yml` in production.

services:
  postgres:
    image: "postgres:17-alpine"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postgres-net
    env_file: .env
    healthcheck:
      test: pg_isready
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 5s

  web:
    <<: &web
      # Image name is changed in production:
      image: "datavac:dev"
      volumes:
        - django-static:/var/www/django/static
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - web-net
        - postgres-net
      env_file: .env
    command: python -We -bb backend/manage.py runserver 0.0.0.0:8000

  redis:
    image: "redis:7-alpine"
    restart: unless-stopped
    networks:
      - web-net
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery_worker:
    <<: *web
    working_dir: /code/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m celery -A datavac.celery:app worker --loglevel=info

  celery_beat:
    <<: *web
    working_dir: /code/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    command: >
      python -m celery -A datavac.celery:app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

networks:
  # Network for postgres, use it for services that need access to the db:
  postgres-net:
  # Network for your internals, use it by default:
  web-net:

volumes:
  postgres-data:
  django-static:
